    summary: "Archive/delete a Look (soft archive_at + reason/note, hard delete); active views exclude archived looks; derived 'incomplete' flag when a member is archived; archiving a piece reminds (no cascade); retired looks listed on /archive. Pieces are never deleted by archiving/deleting a look."
